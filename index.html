<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved look before the first paint, so a dark look never flashes white.
      // Keep in step with applyLook() in src/lib/look.ts.
      (function () {
        var d = document.documentElement, s = null;
        try { s = JSON.parse(localStorage.getItem(localStorage.getItem('kanjistudy-study') === 'en' ? 'kanjistudy-en' : 'kanjistudy') || 'null'); } catch (e) {}
        var st = (s && s.settings) || {};
        var look = st.look || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper');
        d.dataset.look = look;
        if (st.palette) d.dataset.palette = st.palette;
        document.querySelector('meta[name=theme-color]').content = { paper: '#ffffff', night: '#15171c', arcade: '#1e1b45' }[look];
      })();
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>言葉の鎖 · Kanji Study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
